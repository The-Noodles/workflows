# The Noodles Hub のビルド（公開）。各リポジトリの .github/workflows/noodles.yml から呼ぶ。
# compose.yaml の build: があるサービスをビルドし、GitHub ActionsのOIDCトークンで registry.noodles.jp に push する。
# 秘密情報は使わない。Hubは、このワークフローが成功したことを Webhook で受けてデプロイする。
name: build
on:
  workflow_call:
    inputs:
      path:
        description: リポジトリの中の置き場所（compose.yaml と noodles.yaml がある場所）
        type: string
        default: "."

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      # pull_request の github.sha はマージ用の仮のコミットなので、PRの先頭のコミットを使う
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v7
        with:
          repository: The-Noodles/workflows
          ref: v1
          path: .noodles-workflows
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.3
      - name: noodles.yaml と宣言漏れの確認
        env:
          APP_PATH: ${{ inputs.path }}
        run: python3 .noodles-workflows/scripts/check.py "$APP_PATH"
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: crane と Railpack を入れる
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          go install github.com/railwayapp/railpack/cmd/cli@v0.43.0
          mv "$(go env GOPATH)/bin/cli" "$(go env GOPATH)/bin/railpack"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: ビルドして push する
        env:
          APP_PATH: ${{ inputs.path }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          NOODLES_DOCKER_CONFIG: ${{ runner.temp }}/noodles-docker
        run: python3 .noodles-workflows/scripts/build.py
